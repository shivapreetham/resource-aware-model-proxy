[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-llm"
version = "0.5.0"
description = "RAMP: Resource-Aware Model Proxy - an elastic local LLM daemon that auto-calibrates model size to available RAM, VRAM and disk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shivapreetham" }]
keywords = [
    "llm", "local-llm", "llama.cpp", "ollama", "elastic", "quantization",
    "proxy", "openai-api", "memory-management", "inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: Proxy Servers",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/shivapreetham/resource-aware-model-proxy"
Repository = "https://github.com/shivapreetham/resource-aware-model-proxy"
Issues = "https://github.com/shivapreetham/resource-aware-model-proxy/issues"
Changelog = "https://github.com/shivapreetham/resource-aware-model-proxy/blob/main/CHANGELOG.md"
Concepts = "https://github.com/shivapreetham/resource-aware-model-proxy/blob/main/docs/CONCEPTS.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ramp = "ramp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
