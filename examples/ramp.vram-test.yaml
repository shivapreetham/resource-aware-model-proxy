# VRAM-pressure isolation test.
#
# The RAM margin is deliberately low and the VRAM margin deliberately high,
# so that GPU pressure alone triggers the switch while system RAM stays
# healthy. The fallback tier declares est_vram_mb: 0 (CPU-only), so it
# remains available no matter how full the GPU gets.
#
# Reproduce:
#   ramp -c examples/ramp.vram-test.yaml
#   ollama run llama3.1 ""        # occupy ~5.4 GB of VRAM
#   curl http://127.0.0.1:8091/ramp/status

listen:
  host: 127.0.0.1
  port: 8091

backend: ollama
ollama_bin: C:/Users/Shivapreetham/AppData/Local/Programs/Ollama/ollama.exe
ollama_url: http://127.0.0.1:11434

poll_interval_s: 2
safety_margin_mb: 1200          # low: RAM should not be the trigger here
vram_safety_margin_mb: 3000     # high: GPU pressure trips first
vram_upgrade_extra_mb: 256
disk_min_free_mb: 5120

hysteresis:
  downgrade_after_samples: 2
  upgrade_after_s: 15
  upgrade_extra_mb: 512
  critical_free_mb: 800

tiers:
  - name: qwen2.5-1.5b-gpu
    model: ramp-qwen-1.5b
    est_ram_mb: 2200
    est_vram_mb: 1800

  - name: qwen2.5-0.5b-cpu
    model: ramp-qwen-0.5b
    est_ram_mb: 1000
    est_vram_mb: 0              # CPU-only fallback: never VRAM-constrained
