# Minimal Prometheus scrape config for RAMP.
#
#   prometheus --config.file=examples/monitoring/prometheus.yml
#
# Then point Grafana at Prometheus and graph ramp_* series. See
# docs/MONITORING.md for which numbers actually matter and why.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ramp
    metrics_path: /ramp/metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
        labels:
          instance: laptop
